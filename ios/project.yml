name: VisualTimer
options:
  bundleIdPrefix: com.datachain
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 6564A59YJ2
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic

targets:
  VisualTimer:
    type: application
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: VisualTimer
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datachain.visualtimer
        INFOPLIST_FILE: VisualTimer/Resources/Info.plist
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: true
        PRODUCT_NAME: VisualTimer
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          SWIFT_OPTIMIZATION_LEVEL: -Owholemodule

  VisualTimerTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget:
      iOS: "17.0"
    sources:
      - path: VisualTimerTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.datachain.visualtimer.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VisualTimer.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VisualTimer"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: VisualTimer
